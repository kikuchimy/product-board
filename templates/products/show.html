{% extends "base.html" %}

{% block title %}{{ product.name }} | 八幡平 産直掲示板{% endblock %}

{% block content %}
<article>
    <header><h1>{{ product.name }}</h1></header>
    <p>価格: {{ "{:,}".format(product.price) }}円</p>
    <p>生産者: <a href="{{ url_for('producer_show', producer_id=product.producer.id) }}">{{ product.producer.name }}</a></p>
    <p>{{ product.description }}</p>
    <footer>
        <div class="grid">
            <a href="{{ url_for('edit', product_id=product.id) }}" role="button" style="margin-bottom: 0;">編集</a>
            <form action="{{ url_for('delete', product_id=product.id) }}" method="post" style="margin: 0;" onsubmit="return confirm('削除しますか？')">
                <button type="submit" class="secondary" style="margin-bottom: 0;">削除</button>
            </form>
        </div>
    </footer>
</article>
<a href="{{ url_for('index') }}">一覧に戻る</a>
{% endblock %}
