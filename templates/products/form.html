{% extends "base.html" %}

{% block content %}
<h1>{{ "商品を編集" if product else "商品を登録" }}</h1>

{% if errors %}
<article>
    <ul>
        {% for error in errors %}
        <li>{{ error }}</li>
        {% endfor %}
    </ul>
</article>
{% endif %}

<form method="post">
    <label>
        商品名
        <input type="text" name="name" value="{{ form.get('name', '') }}" required>
    </label>
    <label>
        価格（円）
        <input type="number" name="price" min="0" value="{{ form.get('price', '') }}" required>
    </label>
    <label>
        生産者
        <select name="producer_id" required>
            <option value="">選んでください</option>
            {% for producer in producers %}
            <option value="{{ producer.id }}" {% if form.get('producer_id', '')|string == producer.id|string %}selected{% endif %}>{{  producer.name }}</option>
            {% endfor %}
        </select>
        {% if not producers %}
        <small>生産者がまだいません。先に<a href="{{ url_for('producer_create') }}">生産者を登録</a>してください。</small>
        {% endif %}
    </label>
    <label>
        説明
        <textarea name="description" rows="4">{{ form.get('description', '') }}</textarea>
    </label>
    <button type="submit">{{ "更新する" if product else "登録する" }}</button>
</form>
{% endblock %}
