<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}八幡平 産直掲示板{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <header class="container">
        <nav>
            <ul><li><a href="{{ url_for('index') }}"><strong>八幡平 産直掲示板</strong></a></li></ul>
            <ul>
                <li><a href="{{ url_for('producer_index') }}">生産者</a></li>
                <li><a href="{{ url_for('create') }}" role="button">商品を登録</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        {% for message in get_flashed_messages() %}
            <article>{{ message }}</article>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
